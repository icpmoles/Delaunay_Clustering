name: build_test.yml
on:
  push:
    paths-ignore:
      - "docs"
      - ".idea"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build_binary:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile
        run: |
          docker run -v "./:/project_source/:ro" -v "./common_build_dir:/project/common_build_dir/:rw"  --entrypoint="/project_source/docker/entrypoint.sh"  --network=host ghcr.io/icpmoles/delaunay_clustering:polygon_extension 

      - name: Test
        run: |
          ./common_build_dir/build_dir/install/bin/polygon_triangulation --b=0.125 --size=5
          ./common_build_dir/build_dir_debug/install/bin/polygon_triangulation --b=0.125 --size=5

